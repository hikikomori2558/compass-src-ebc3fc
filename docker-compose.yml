# COMPASS-HYBRID v2.6 — инфраструктура команды Rapira (Разработчик №1)
# Подъём:  docker compose up -d
# Логи:    docker compose logs -f api
# Схема БД применяется автоматически при ПЕРВОМ старте тома (docker-entrypoint-initdb.d).
# Seed:    python3 backend/db/seed.py   (после поднятия db)
services:
  db:
    image: postgres:16-alpine
    container_name: compass_db
    environment:
      POSTGRES_DB: compass
      POSTGRES_USER: compass_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compass_demo}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass_app -d compass"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: compass_redis
    # Метрика №7 (RPO=0): AOF с appendfsync always — каждая запись на диск до ACK
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      # DNS домашней Debian-ноды — Tailscale MagicDNS (100.100.100.100), недоступный
      # из дефолтной bridge-сети сборки: apt-get внутри builder не резолвит deb.debian.org.
      # host-сеть сборки использует resolv.conf хоста — сборка проходит.
      network: host
    container_name: compass_api
    environment:
      DATABASE_URL: postgresql://compass_api:compass_api_demo@db:5432/compass
      REDIS_URL: redis://redis:6379/0
      # Секреты БЕЗ девелоперских фолбэков: забытый .env = явная ошибка старта,
      # а не «тихий» запуск с публичными ключами (см. .env.example)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET обязателен — скопируйте .env.example}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      DEMO_ACCESS_KEY: ${DEMO_ACCESS_KEY:-}
      PII_PEPPER: ${PII_PEPPER:?PII_PEPPER обязателен — скопируйте .env.example}
      CORS_ORIGINS: "*"
      # QR-приглашение пациента ведёт на PWA; для показа с телефона укажи LAN-IP:
      # PATIENT_APP_URL=http://<LAN-IP>:5501/ (в .env или окружении docker compose)
      PATIENT_APP_URL: ${PATIENT_APP_URL:-http://127.0.0.1:5501/}
      # «Проприетарная» ЭМК вендора — отдельный сервис (см. backend_emc/server.py);
      # COMPASS-шлюз проксирует /emc и /api/emc туда, публичный домен один.
      EMC_UPSTREAM: ${EMC_UPSTREAM:-http://emc:8100}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Слим-образ без curl — healthcheck на чистом python; /healthz проверяет
    # и сам API, и его связь с БД и Redis (degraded сразу виден в docker ps).
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # «Проприетарная» ЭМК вендора: отдельный процесс, свой API (/api/emc/*),
  # своя статика (frontend_emc/). Ноль кода COMPASS внутри — сайдбар врача
  # работает ПОВЕРХ, читая данные с экрана (frontend_compass/agent.js).
  emc:
    build:
      context: .
      network: host
    container_name: compass_emc
    command: python3 -m backend_emc.server
    environment:
      EMC_BIND: "0.0.0.0"
    expose:
      - "8100"
    restart: unless-stopped

# Боевой TLS-гейт (профиль prod — на ноутбуке не стартует): Caddy сам держит
  # Let's Encrypt для projectc.work.gd и проксирует на api. Caddyfile в репо.
  caddy:
    image: caddy:2
    container_name: compass_caddy
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
