<text x="90" y="892" font-family="Georgia, Times New Roman, serif" font-size="34" font-style="italic" fill="white">«Мысли о самостоятельной импульсивной отмене приёма препарата</text>
<text x="90" y="938" font-family="Georgia, Times New Roman, serif" font-size="34" font-style="italic" fill="white">пойманы до воплощения в жизнь — и обговорены с врачом»</text>
<text x="90" y="978" font-family="Inter, Arial, sans-serif" font-size="15" fill="#9A8FB5">А не «пациент любой ценой остался на препарате»: плановая замена или отмена по решению врача — тоже успешный исход.</text>
