<text x="120" y="676" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="2.5" fill="#C3C8CF">ГЛАВНАЯ МЕТРИКА УСПЕХА ПИЛОТА</text>
<text x="120" y="736" font-family="Georgia, serif" font-size="40" fill="white">Мысли о самостоятельной импульсивной отмене</text>
<text x="120" y="788" font-family="Georgia, serif" font-size="40" fill="white">приёма препарата пойманы до воплощения в жизнь</text>
<text x="120" y="840" font-family="Georgia, serif" font-size="40" fill="white">и обговорены с врачом</text>
<text x="120" y="886" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#C3C8CF">А не «пациент любой ценой остался на препарате»: плановая замена или отмена по решению врача —</text>
<text x="120" y="910" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#C3C8CF">тоже успешный исход: сохраняет репутацию препарата и убирает предрассудки вокруг терапии.</text>
