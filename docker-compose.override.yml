# Локальный override: БД наружу на 5433, а не 5432.
#
# Причина: на этой машине 5432 периодически отвечает СТАРЫМ postgres (колечко
# port-forward'ов colima/остаточные проброски) — schema.sql применяется в контейнер,
# а localhost:5432 в разные моменты показывает разное состояние базы. 5433 чист.
# Внутрь сети сервисов ничего не меняется: api ходит на db:5432 как раньше.
# Override-файл коммитится: у Миши на Linux-машине конфликтов с 5432 нет, но
# единообразие важнее (можно удалить локально, если 5432 свободен).
services:
  db:
    ports:
      - "5433:5432"
