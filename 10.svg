<text x="78" y="1038" font-family="Inter, Arial, sans-serif" font-size="13.5" fill="#6B7280">Показатели — по артефактам репозитория (benchmarks/, scripts/, backend/, tests/). Нагрузка и 0,4 мс — замер на боевом VPS 2 vCPU сегодня; 11 сютов — прогон сегодня.</text>
<text x="78" y="1058" font-family="Inter, Arial, sans-serif" font-size="13.5" fill="#6B7280">Hold-out — 24 синтетические виньетки, не участвовавшие в настройке правил: инженерная проверка, а не клиническое исследование.</text>
